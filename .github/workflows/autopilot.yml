name: GTA 6 Autopilot

on:
  schedule:
    # GitHub often delays or drops timed runs, so we wake up every 30 min and
    # autopilot/slots.py decides if a post is due. Post times (India time) are in config.yaml -> post_times
    - cron: "7,37 * * * *"
  workflow_dispatch:
    inputs:
      topic:
        description: "Optional: make a video about this topic instead of the latest news"
        required: false
        default: ""

concurrency:
  group: autopilot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  make-and-post:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      META_PAGE_ID: ${{ secrets.META_PAGE_ID }}
      META_PAGE_TOKEN: ${{ secrets.META_PAGE_TOKEN }}
      META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Is a post due?
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then echo "go=yes" >> $GITHUB_OUTPUT; exit 0; fi
          pip install -q pyyaml
          SLOT=$(python autopilot/slots.py)
          echo "due slot: '$SLOT'"
          if [ -z "$SLOT" ]; then echo "go=no" >> $GITHUB_OUTPUT; exit 0; fi
          echo "$SLOT" > state/last_slot.txt
          git config user.name "autopilot-bot" && git config user.email "bot@users.noreply.github.com"
          git add state/last_slot.txt && git commit -qm "claim slot $SLOT" && git pull -q --rebase --autostash && git push -q
          echo "go=yes" >> $GITHUB_OUTPUT
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.go == 'yes'
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        if: steps.gate.outputs.go == 'yes'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          pip install -q -r requirements.txt
          python -m playwright install --with-deps chromium > /dev/null
      - name: Get clip library
        if: steps.gate.outputs.go == 'yes'
        run: |
          gh release download library -p clips.tar -D /tmp
          mkdir -p library/clips && tar -xf /tmp/clips.tar -C library/clips
          mkdir -p library/stills
          gh release download library -p stills.tar -D /tmp && tar -xf /tmp/stills.tar -C library/stills || echo "no stills yet"
      - name: Upload settings for platforms that are not connected yet
        if: steps.gate.outputs.go == 'yes'
        run: |
          [ -n "$YT_REFRESH_TOKEN" ] || sed -i 's/^upload_youtube: true/upload_youtube: false/' config.yaml
          [ -n "$META_PAGE_TOKEN" ] || sed -i -e 's/^upload_instagram: true/upload_instagram: false/' -e 's/^upload_facebook: true/upload_facebook: false/' config.yaml
      - name: Make and post
        if: steps.gate.outputs.go == 'yes'
        run: |
          if [ -n "${{ github.event.inputs.topic }}" ]; then
            python -m autopilot.run --topic "${{ github.event.inputs.topic }}"
          else
            python -m autopilot.run
          fi
      - name: Keep the finished video for 7 days (download from this run's page)
        if: always() && steps.gate.outputs.go == 'yes'
        uses: actions/upload-artifact@v4
        with:
          name: shorts
          path: output/**/*.mp4
          retention-days: 7
          if-no-files-found: ignore
      - name: Save memory (used stories, clip usage)
        if: always() && steps.gate.outputs.go == 'yes'
        run: |
          git checkout -- config.yaml
          git config user.name "autopilot-bot"
          git config user.email "autopilot-bot@users.noreply.github.com"
          git add -f autopilot.db library/index.json library/stills.json logs/autopilot.log debug/ || true
          git commit -m "autopilot run $(date -u +%F_%H%M)" || exit 0
          git pull --rebase --autostash -q && git push -q
