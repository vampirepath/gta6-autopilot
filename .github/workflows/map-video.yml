name: Map Video (Vice City Center style)

on:
  workflow_dispatch:
    inputs:
      spec:
        description: "Script file to render"
        required: true
        default: "scripts/leonida_tour.json"
      post:
        description: "no = just send to Telegram, review = Telegram buttons (auto-post after 10 min), now = post right away"
        required: true
        default: "no"
      asset:
        description: "Optional: post an already-rendered file from the map-videos release instead of rendering"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
      YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
      YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install -q -r requirements.txt
      - name: Get official screenshots
        run: |
          mkdir -p library/stills
          gh release download library -p stills.tar -D /tmp && tar -xf /tmp/stills.tar -C library/stills
      - name: Render
        if: inputs.asset == ''
        run: |
          mkdir -p output
          NAME=$(basename "${{ inputs.spec }}" .json)_$(date -u +%m%d_%H%M)
          echo "NAME=$NAME" >> $GITHUB_ENV
          python -m autopilot.mapvideo "${{ inputs.spec }}" --out output/$NAME.mp4
      - name: Use an existing video
        if: inputs.asset != ''
        run: |
          mkdir -p output && gh release download map-videos -p "${{ inputs.asset }}" -D output
          echo "NAME=$(basename '${{ inputs.asset }}' .mp4)" >> $GITHUB_ENV
      - name: Send to Telegram (review only, not posted)
        if: inputs.post == 'no' && inputs.asset == ''
        run: |
          python - <<'PY'
          import json, os, requests, subprocess
          from pathlib import Path
          v = Path("output") / (os.environ["NAME"] + ".mp4")
          small = v
          if v.stat().st_size > 45e6:
              small = v.with_name(v.stem + "_tg.mp4")
              subprocess.run(["ffmpeg","-y","-v","error","-i",str(v),"-vf","scale=720:-2","-crf","28","-preset","veryfast",str(small)])
          meta = json.loads(Path("${{ inputs.spec }}").read_text())
          cap = f"🗺 NEW STYLE TEST (not posted)\n\n{meta['yt_title']}"
          with open(small, "rb") as f:
              r = requests.post(f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendVideo",
                                data={"chat_id": os.environ["TELEGRAM_CHAT_ID"], "caption": cap, "supports_streaming": "true"},
                                files={"video": f}, timeout=300)
          print(r.json().get("ok"), r.text[:200])
          PY
      - name: Post to YouTube
        if: inputs.post != 'no'
        run: python -m autopilot.post_map output/$NAME.mp4 "${{ inputs.spec }}" "${{ inputs.post }}"
      - name: Keep the video (release "map-videos")
        if: inputs.asset == ''
        run: |
          gh release view map-videos >/dev/null 2>&1 || gh release create map-videos --title "Map videos" --notes "Rendered map-style Shorts"
          gh release upload map-videos output/$NAME.mp4 --clobber
          mkdir -p debug && cp output/${NAME}_sheet.jpg debug/map_sheet.jpg
          git config user.name "autopilot-bot" && git config user.email "bot@users.noreply.github.com"
          git add debug/map_sheet.jpg && git commit -qm "map video sheet" && git pull -q --rebase --autostash && git push -q || true
