name: Super Clipper Promo Reels

# 3 promo reels a day for the GTA 6 Super Clipper app.
# Each finished reel + cover + ready-to-paste caption is sent to your Telegram.
# Nothing is posted anywhere – you upload to Instagram yourself.
on:
  schedule:
    - cron: "13 4,9,14 * * *"     # about 9:43 AM, 2:43 PM, 7:43 PM India time (GitHub can run a bit late)
  workflow_dispatch:

concurrency:
  group: promo-reels
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  make-reel:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      PROMO_VOICE_ID: ${{ secrets.PROMO_VOICE_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-noto-color-emoji
          pip install -q requests pyyaml python-dotenv numpy scipy soundfile librosa playwright pillow
          [ -x /usr/bin/google-chrome ] || python -m playwright install --with-deps chromium
      - name: Make the reel and send it to Telegram
        run: python -m promo.make
      - name: Keep the files for 7 days (download from this run's page)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: promo-reel
          path: |
            output/promo/*.mp4
            output/promo/*.jpg
            output/promo/reel_*/script.json
          retention-days: 7
          if-no-files-found: ignore
      - name: Remember used hooks
        if: success()
        run: |
          git config user.name "autopilot-bot"
          git config user.email "autopilot-bot@users.noreply.github.com"
          git add promo/state
          git commit -qm "promo reel $(date -u +%F_%H%M)" || exit 0
          for i in 1 2 3; do git pull -q --rebase --autostash && git push -q && break; sleep 5; done
