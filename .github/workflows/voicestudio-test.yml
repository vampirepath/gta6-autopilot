name: VoiceStudio voice test
on: workflow_dispatch
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PROMO_TELEGRAM_BOT_TOKEN: ${{ secrets.PROMO_TELEGRAM_BOT_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install VoxCPM2 (CPU)
        run: |
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q "voxcpm>=2.0.3" soundfile requests && sudo apt-get install -y -qq ffmpeg
      - name: Make test voices and send to Telegram
        run: python promo/voice_test.py
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: voice-test, path: output/voice_test/*.wav, if-no-files-found: ignore }
