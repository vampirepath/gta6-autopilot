<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:H;src:url(a/anton.woff2)}
@font-face{font-family:P;src:url(a/pop400.woff2);font-weight:400}
@font-face{font-family:P;src:url(a/pop600.woff2);font-weight:600}
@font-face{font-family:P;src:url(a/pop800.woff2);font-weight:800}
@font-face{font-family:Y;src:url(a/yt.woff2)}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#070304}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:P;color:#fff}
#bg{position:absolute;inset:0;background:radial-gradient(70% 45% at 50% 30%,#2a0a10 0%,#14060a 45%,#070304 85%)}
#grid{position:absolute;inset:-200px;opacity:.16;background-image:linear-gradient(rgba(255,59,92,.5) 1px,transparent 1px),linear-gradient(90deg,rgba(255,59,92,.5) 1px,transparent 1px);background-size:90px 90px;mask-image:radial-gradient(60% 50% at 50% 45%,#000 20%,transparent 75%);-webkit-mask-image:radial-gradient(60% 50% at 50% 45%,#000 20%,transparent 75%)}
#glow{position:absolute;width:1400px;height:1400px;left:-160px;top:-300px;border-radius:50%;background:radial-gradient(circle,rgba(255,176,32,.22),transparent 60%);}
#grain{position:absolute;inset:0;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#vig{position:absolute;inset:0;background:radial-gradient(90% 70% at 50% 40%,transparent 50%,rgba(0,0,0,.75) 100%)}
#mx{position:absolute;inset:0;overflow:hidden}
#mx i{position:absolute;border-radius:50%;background:radial-gradient(circle,#fff3f1,#ff3b5c 40%,transparent 70%)}
#flash{position:absolute;inset:0;opacity:0;pointer-events:none}
#scenes{position:absolute;inset:0}
.scene{position:absolute;inset:0;display:none}
.kick{position:absolute;left:0;right:0;text-align:center;font:600 26px/1 P;letter-spacing:.42em;color:#d6a9ad;text-transform:uppercase}
.kick::before,.kick::after{content:"";display:inline-block;width:60px;height:2px;background:rgba(255,255,255,.25);vertical-align:middle;margin:0 18px}
.hl{position:absolute;left:40px;right:40px;text-align:center;font-family:H;font-style:italic;text-transform:uppercase;line-height:.95;letter-spacing:.005em}
.hl .w{display:inline-block;padding:0 .14em 0 .06em}
.wh{color:#fff;text-shadow:0 6px 0 rgba(0,0,0,.35),0 0 30px rgba(0,0,0,.6)}
.yl{background:linear-gradient(180deg,#fff3f1 0%,#ff3b5c 50%,#ffb020 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 rgba(0,0,0,.4)) drop-shadow(0 0 26px rgba(255,59,92,.55))}
.ol{color:transparent;-webkit-text-stroke:5px #ff3b5c;filter:drop-shadow(0 0 26px rgba(255,59,92,.6))}
.rd{background:linear-gradient(180deg,#ff6b6b,#ff2340);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 6px 0 rgba(0,0,0,.35))}
.sc{font-family:Y;font-style:normal;text-transform:none;color:#fff;font-size:.62em}
.card{position:absolute;border-radius:28px;background:linear-gradient(180deg,rgba(18,14,46,.93),rgba(8,6,22,.96));border:2px solid rgba(255,59,92,.2);box-shadow:0 30px 80px rgba(0,0,0,.55)}
.live{display:inline-flex;align-items:center;gap:8px;background:#ff2340;color:#fff;font:800 22px/1 P;padding:8px 12px;border-radius:8px;letter-spacing:.06em}
.live::before{content:"";width:10px;height:10px;border-radius:50%;background:#fff}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.cap{position:absolute;left:60px;right:60px;top:1560px;text-align:center;font:800 54px/1.2 P;color:#fff;text-shadow:0 4px 14px rgba(0,0,0,.95),0 0 3px #000}
.cap .on{color:#ff3b5c}
.img{position:absolute;background-size:cover;background-position:center;border-radius:24px}
.spin{width:54px;height:54px;border-radius:50%;border:5px solid rgba(255,255,255,.15);border-top-color:#ff3b5c}
.chip{display:inline-flex;align-items:center;gap:10px;padding:12px 20px;border-radius:999px;background:rgba(255,255,255,.07);border:2px solid rgba(255,255,255,.12);font:700 26px/1 P;color:#ffeaea}
.chip.ok{border-color:#ff3b5c;color:#fff;background:rgba(255,59,92,.14)}
.tick{width:30px;height:30px;border-radius:50%;background:#2bd67b;display:grid;place-items:center;font:800 20px/1 P;color:#062b16}
</style></head><body>
<div id="stage">
  <div id="bg"></div><div id="grid"></div><div id="mx"></div><div id="glow"></div><div id="grain"></div>
  <div id="scenes"></div>
  <div id="vig"></div>
  <div class="cap" id="cap"></div>
  
  <div id="flash"></div>
</div>
<script>
const W=WORDS; // injected
const $=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const easeIO=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=clamp(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const fmt=n=>Math.round(n).toLocaleString('en-IN');
const fmtUS=n=>Math.round(n).toLocaleString('en-US');
const scenesEl=document.getElementById('scenes');
const SC=[];
function scene(start,end,html,update,opts={}){const el=$(`<div class="scene">${html}</div>`);scenesEl.appendChild(el);SC.push({start,end,el,update,opts});}
// headline helper: words appear with blur-rise stagger. spec: [[text,cls],...] lines separated by '|'
function HL(id,top,size,lines){return `<div class="hl" id="${id}" style="top:${top}px;font-size:${size}px">${lines.map(l=>`<div>${l.map(([t,c])=>`<span class="w ${c}">${t}</span>`).join(' ')}</div>`).join('')}</div>`}
function animHL(el,lt,delay=0,stag=.09){[...el.querySelectorAll('.w')].forEach((w,i)=>{const p=clamp((lt-delay-i*stag)/.32);const e=ease(p);w.style.opacity=p;w.style.transform=`translateY(${(1-e)*60}px) scale(${1+(1-e)*.15})`;w.style.filter=`blur(${(1-e)*14}px)`})}
function pop(el,lt,delay=0,dur=.4){const p=clamp((lt-delay)/dur);el.style.opacity=clamp(p*2);el.style.transform=(el.dataset.base||'')+` scale(${.6+.4*back(p)})`;}
function rise(el,lt,delay=0,dur=.45,dist=120){const p=ease((lt-delay)/dur);el.style.opacity=p;el.style.transform=(el.dataset.base||'')+` translateY(${(1-p)*dist}px)`;}
function kickA(el,lt,d=0){const p=ease((lt-d)/.35);el.style.opacity=p;el.style.letterSpacing=(.7-.28*p)+'em'}
