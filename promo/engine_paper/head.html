<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
/*SKIN*/
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bgc)}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:B;color:var(--ink)}
#bg{position:absolute;inset:0;background:var(--bg)}
#dots{position:absolute;inset:-60px;background-image:var(--pat);background-size:var(--patsz);opacity:var(--patop)}
#grain{position:absolute;inset:0;opacity:var(--grain);mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#scenes{position:absolute;inset:0}
.scene{position:absolute;inset:0;display:none}
#wipe{position:absolute;top:0;bottom:0;width:1300px;left:-2000px;background:var(--w1);z-index:20;transform:skewX(-8deg)}
#wipe2{position:absolute;top:0;bottom:0;width:1300px;left:-2000px;background:var(--w2);z-index:19;transform:skewX(-8deg)}
.h{font-family:H;font-weight:var(--hw);font-size:112px;line-height:var(--hlh);letter-spacing:var(--hls);text-transform:var(--htt);color:var(--headc)}
.card .h,.note .h,.tag .h{color:var(--ink)}
.s{font-family:S;font-style:italic;font-weight:400;letter-spacing:-.01em;text-transform:none}
.hand{font-family:C;color:var(--acc)}
.mk{position:relative;display:inline-block;z-index:0;padding:0 .08em;color:var(--mkc)}
.mk::before{content:"";position:absolute;left:-.06em;right:-.06em;top:.48em;bottom:.02em;background:var(--hl);z-index:-1;border-radius:.08em;transform:skewX(-6deg) scaleX(var(--m,1));transform-origin:left}
.card{position:absolute;background:var(--card);border:5px solid var(--line);border-radius:var(--rad);box-shadow:12px 12px 0 var(--sh);overflow:hidden;color:var(--ink)}
.tag{display:inline-flex;align-items:center;gap:10px;padding:12px 22px;border:4px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink);font:700 38px/1 B;box-shadow:6px 6px 0 var(--sh)}
.live{display:inline-flex;align-items:center;gap:8px;background:#ff2340;color:#fff;font:800 22px/1 B;padding:8px 12px;border-radius:8px;letter-spacing:.06em}
.live::before{content:"";width:10px;height:10px;border-radius:50%;background:#fff}
.note{position:absolute;padding:26px 30px;background:var(--hl);color:var(--onhl);border:4px solid var(--line);font:700 44px/1.15 B;box-shadow:8px 8px 0 var(--sh)}
.step{position:absolute;left:60px;top:150px;display:flex;align-items:center;gap:22px;z-index:5}
.step b{display:grid;place-items:center;width:130px;height:130px;border-radius:50%;background:var(--acc);color:#fff;border:5px solid var(--line);font:800 64px/1 B;box-shadow:6px 6px 0 var(--sh)}
.step span{font-family:H;font-weight:var(--hw);font-size:64px;letter-spacing:var(--hls);text-transform:var(--htt);color:var(--headc)}
.cap{position:absolute;left:70px;right:70px;top:1590px;text-align:center;z-index:15}
.cap .box{display:inline-block;padding:16px 28px;background:var(--capbg);color:var(--capc);border:5px solid var(--line);border-radius:22px;box-shadow:8px 8px 0 var(--sh);font:800 54px/1.15 B;letter-spacing:-.01em;max-width:940px}
.cap .on{background:var(--hl);color:var(--onhl);border-radius:8px;padding:0 6px}
#flash{position:absolute;inset:0;opacity:0;pointer-events:none;z-index:18}
</style></head><body>
<div id="stage">
  <div id="bg"></div><div id="dots"></div><div id="grain"></div>
  <div id="scenes"></div>
  <div class="cap" id="cap"></div>
  <div id="flash"></div><div id="wipe2"></div><div id="wipe"></div>
</div>
<script>
const W=WORDS; // injected
const $=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const easeIO=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=clamp(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const scenesEl=document.getElementById('scenes');
const SC=[];
function scene(start,end,html,update,opts={}){const el=$(`<div class="scene">${html}</div>`);scenesEl.appendChild(el);SC.push({start,end,el,update,opts});}
