<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:B;src:url(f/bricolage-grotesque-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:B;src:url(f/bricolage-grotesque-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:B;src:url(f/bricolage-grotesque-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:C;src:url(f/caveat-latin-700-normal.woff2)}
@font-face{font-family:S;src:url(f/instrument-serif-latin-400-italic.woff2);font-style:italic}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1080px;height:1920px;overflow:hidden;background:#f3eee3}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;font-family:B;color:#141414}
#bg{position:absolute;inset:0;background:#f3eee3}
#dots{position:absolute;inset:-60px;background-image:radial-gradient(#141414 1.6px,transparent 1.7px);background-size:44px 44px;opacity:.11}
#grain{position:absolute;inset:0;opacity:.18;mix-blend-mode:multiply;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='220' height='220'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/><feColorMatrix values='0 0 0 0 .5  0 0 0 0 .45  0 0 0 0 .4  0 0 0 .5 0'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#scenes{position:absolute;inset:0}
.scene{position:absolute;inset:0;display:none}
#wipe{position:absolute;top:0;bottom:0;width:1300px;left:-2000px;background:#141414;z-index:20;transform:skewX(-8deg)}
#wipe2{position:absolute;top:0;bottom:0;width:1300px;left:-2000px;background:#ff4a1c;z-index:19;transform:skewX(-8deg)}
.h{font:800 112px/.98 B;letter-spacing:-.035em}
.s{font-family:S;font-style:italic;font-weight:400;letter-spacing:-.01em}
.hand{font-family:C;color:#ff4a1c}
.mk{position:relative;display:inline-block;z-index:0;padding:0 .08em}
.mk::before{content:"";position:absolute;left:-.06em;right:-.06em;top:.48em;bottom:.02em;background:#ffe14a;z-index:-1;border-radius:.08em;transform:scaleX(var(--m,1));transform-origin:left;transform:skewX(-6deg) scaleX(var(--m,1))}
.card{position:absolute;background:#fff;border:5px solid #141414;border-radius:26px;box-shadow:12px 12px 0 #141414;overflow:hidden}
.tag{display:inline-flex;align-items:center;gap:10px;padding:12px 22px;border:4px solid #141414;border-radius:999px;background:#fff;font:700 38px/1 B;box-shadow:6px 6px 0 #141414}
.live{display:inline-flex;align-items:center;gap:8px;background:#ff2340;color:#fff;font:800 22px/1 B;padding:8px 12px;border-radius:8px;letter-spacing:.06em}
.live::before{content:"";width:10px;height:10px;border-radius:50%;background:#fff}
.note{position:absolute;padding:26px 30px;background:#ffe14a;border:4px solid #141414;font:700 44px/1.15 B;box-shadow:8px 8px 0 #141414}
.step{position:absolute;left:60px;top:150px;display:flex;align-items:center;gap:22px;z-index:5}
.step b{display:grid;place-items:center;width:130px;height:130px;border-radius:50%;background:#ff4a1c;color:#fff;border:5px solid #141414;font:800 64px/1 B;box-shadow:6px 6px 0 #141414}
.step span{font:800 64px/1 B;letter-spacing:-.03em}
.cap{position:absolute;left:70px;right:70px;top:1590px;text-align:center;z-index:15}
.cap .box{display:inline-block;padding:16px 28px;background:#fff;border:5px solid #141414;border-radius:22px;box-shadow:8px 8px 0 #141414;font:800 54px/1.15 B;letter-spacing:-.02em;max-width:940px}
.cap .on{background:#ffe14a;border-radius:8px;padding:0 6px}
#flash{position:absolute;inset:0;opacity:0;pointer-events:none;z-index:18}
</style></head><body>
<div id="stage">
  <div id="bg"></div><div id="dots"></div><div id="grain"></div>
  <div id="scenes"></div>
  <div class="cap" id="cap"></div>
  <div id="flash"></div><div id="wipe2"></div><div id="wipe"></div>
</div>
<script>
const W=WORDS; // injected
const $=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>1-Math.pow(1-clamp(x),3);
const easeIO=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const back=x=>{x=clamp(x);const c1=1.70158,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const scenesEl=document.getElementById('scenes');
const SC=[];
function scene(start,end,html,update,opts={}){const el=$(`<div class="scene">${html}</div>`);scenesEl.appendChild(el);SC.push({start,end,el,update,opts});}
